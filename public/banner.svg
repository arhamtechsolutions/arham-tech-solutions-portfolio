<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070B" />
      <stop offset="50%" stop-color="#0B0D12" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1738" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A1A1AA" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Cyber Circuit Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Deep Black Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Cyber Grid Pattern Overlay -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" />

  <!-- Atmospheric Glow Radiance -->
  <circle cx="200" cy="210" r="180" fill="#00E5FF" opacity="0.08" filter="blur(60px)" />
  <circle cx="1000" cy="210" r="180" fill="#FF1738" opacity="0.08" filter="blur(60px)" />

  <!-- Futuristic Border Frame -->
  <rect x="20" y="20" width="1160" height="380" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  
  <!-- Tech Corner Accent Markers -->
  <path d="M 20 60 L 20 20 L 60 20" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#glowCyan)" />
  <path d="M 1140 20 L 1180 20 L 1180 60" fill="none" stroke="#FF1738" stroke-width="3" filter="url(#glowRed)" />
  <path d="M 20 360 L 20 400 L 60 400" fill="none" stroke="#FF1738" stroke-width="3" filter="url(#glowRed)" />
  <path d="M 1140 400 L 1180 400 L 1180 360" fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#glowCyan)" />

  <!-- Cyber Circuit Trace Lines -->
  <path d="M 60 210 L 180 210 L 220 170 L 320 170" fill="none" stroke="#00E5FF" stroke-width="1.5" opacity="0.4" />
  <circle cx="320" cy="170" r="3" fill="#00E5FF" />

  <path d="M 1140 210 L 1020 210 L 980 250 L 880 250" fill="none" stroke="#FF1738" stroke-width="1.5" opacity="0.4" />
  <circle cx="880" cy="250" r="3" fill="#FF1738" />

  <!-- Stylized Emblem Brand Icon (Left Center) -->
  <g transform="translate(180, 210)">
    <!-- Rotating diamond frame -->
    <rect x="-65" y="-65" width="130" height="130" rx="16" fill="rgba(14, 17, 23, 0.85)" stroke="#00E5FF" stroke-width="2" transform="rotate(45)" filter="url(#glowCyan)" />
    <rect x="-58" y="-58" width="116" height="116" rx="12" fill="none" stroke="#FF1738" stroke-width="1.5" transform="rotate(-45)" opacity="0.6" />

    <!-- Stylized 'A' Wings -->
    <path d="M -30 35 L 0 -45 L 20 -45 L 35 15 L 18 15 L 10 -20 L -15 35 Z" fill="url(#cyanBlueGrad)" />
    <path d="M -5 5 L 32 5 L 42 35 L 15 35 Z" fill="url(#chromeGrad)" />
    <circle cx="0" cy="-45" r="4" fill="#FFFFFF" filter="url(#glowCyan)" />
  </g>

  <!-- Central Brand Typography & Message -->
  <!-- Tagline Badge -->
  <g transform="translate(360, 115)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#141822" stroke="rgba(0, 229, 255, 0.4)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#00E5FF" />
    <text x="32" y="19" fill="#00E5FF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">OFFICIAL GITHUB ECOSYSTEM</text>
  </g>

  <!-- Brand Name -->
  <text x="360" y="190" fill="#FFFFFF" font-family="'Syne', 'Space Grotesk', system-ui, sans-serif" font-size="44" font-weight="900" letter-spacing="3">
    ARHAM TECH <tspan fill="#FF1738">SOLUTIONS</tspan>
  </text>

  <!-- Tagline -->
  <text x="360" y="232" fill="#00E5FF" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="4">
    YOUR VISION. OUR EXPERTISE.
  </text>

  <!-- Message & Core Statement -->
  <text x="360" y="270" fill="#A1A1AA" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="400" letter-spacing="1">
    Flutter Mobile Apps • Laravel &amp; PHP Web Engineering • UI/UX Architecture
  </text>

  <!-- Core Message Dots -->
  <text x="360" y="315" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="500" letter-spacing="3">
    IDEAS <tspan fill="#00E5FF">•</tspan> TECHNOLOGY <tspan fill="#FF1738">•</tspan> GROWTH
  </text>

  <!-- Pill Badges (Right Bottom) -->
  <g transform="translate(360, 340)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="85" height="24" rx="6" fill="#141822" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="14" y="16" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10">Flutter</text>

    <!-- Pill 2 -->
    <rect x="95" y="0" width="85" height="24" rx="6" fill="#141822" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="108" y="16" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10">Laravel</text>

    <!-- Pill 3 -->
    <rect x="190" y="0" width="80" height="24" rx="6" fill="#141822" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="207" y="16" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10">PHP</text>

    <!-- Pill 4 -->
    <rect x="280" y="0" width="95" height="24" rx="6" fill="#141822" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="292" y="16" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10">MySQL</text>

    <!-- Pill 5 -->
    <rect x="385" y="0" width="85" height="24" rx="6" fill="#141822" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="403" y="16" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10">Figma</text>

    <!-- Pill 6 -->
    <rect x="480" y="0" width="95" height="24" rx="6" fill="#141822" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="495" y="16" fill="#A1A1AA" font-family="'JetBrains Mono', monospace" font-size="10">REST API</text>
  </g>

  <!-- Live Status Pulse Indicator (Top Right) -->
  <g transform="translate(980, 50)">
    <circle cx="10" cy="10" r="5" fill="#10B981" filter="url(#glowCyan)" />
    <text x="24" y="14" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1">AVAILABLE FOR PROJECTS</text>
  </g>
</svg>

